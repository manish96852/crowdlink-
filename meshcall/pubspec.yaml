name: meshcall
description: Offline Mesh Networking App with Voice Calling - Like Bridgefy + Calls

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  lottie: ^3.0.0
  
  # State Management
  provider: ^6.1.1
  
  # Bluetooth
  flutter_blue_plus: ^1.31.0
  
  # Wi-Fi P2P
  flutter_p2p_connection: 1.0.9
  
  # WebRTC for Voice Calls
  flutter_webrtc: ^1.3.0
  
  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  flutter_map_tile_caching: ^9.0.0
  
  # Encryption
  cryptography: ^2.7.0
  pointycastle: ^3.7.4
  
  # QR Code (for pairing)
  qr_flutter: ^4.1.0
  mobile_scanner: ^4.0.1
  
  # Local Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Audio - Real-time streaming for offline voice calls
  flutter_sound: ^9.30.0
  record: ^6.0.0
  permission_handler: ^10.4.5
  
  # Utilities
  uuid: ^4.2.1
  intl: ^0.19.0
  connectivity_plus: ^5.0.2
  device_info_plus: ^10.0.1
  share_plus: ^7.2.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

dependency_overrides:
  permission_handler_android: 13.0.0
  permission_handler_platform_interface: 4.2.3
  permission_handler_apple: 9.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
